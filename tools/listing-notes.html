<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>매물 노트</title>
<style>
/* 손푸미에 포함: 글꼴은 자체 호스팅, 색상은 손푸미 공통 토큰(design.md 5장)을 따른다. */
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url("PretendardVariable.woff2") format("woff2-variations")}
/* 레이아웃: 상단 바(파일명·저장 상태·파일 버튼) → 툴바(상태 필터·검색·추가) → 스프레드시트 그리드(왼쪽 #·아파트 고정, 아파트 이름 옆에 바로가기 아이콘) → 하단 상태 줄 */
:root{
  --bg:#F7F8FA; --panel:#FFFFFF; --sunken:#EEF0F4; --hover:#F1F3F6; --sel:#EAF0FF;
  --line:#DDE1E8; --line-2:#C9CED8; --text:#20232A; --text-2:#5B616D; --text-3:#7A818E;
  --accent:#365DCB; --accent-2:#294AA9; --accent-soft:#EAF0FF; --on-accent:#FFFFFF;
  --danger:#B33042; --danger-soft:rgba(179,48,66,.10);
  --shadow:0 0 0 1px rgba(16,16,24,.06),0 8px 24px -6px rgba(16,16,24,.16),0 2px 6px rgba(16,16,24,.06);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Inter",system-ui,sans-serif;
  --name-w:240px; --rn:60px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111318; --panel:#191C23; --sunken:#20242C; --hover:#232730; --sel:#24304D;
    --line:#373D49; --line-2:#454C5A; --text:#ECEEF3; --text-2:#B3BAC8; --text-3:#8D95A5;
    --accent:#98B5FF; --accent-2:#B4C9FF; --accent-soft:#24304D; --on-accent:#111318;
    --danger:#FF9DAA; --danger-soft:rgba(255,157,170,.14);
    --shadow:0 0 0 1px rgba(255,255,255,.07),0 12px 32px -8px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111318; --panel:#191C23; --sunken:#20242C; --hover:#232730; --sel:#24304D;
  --line:#373D49; --line-2:#454C5A; --text:#ECEEF3; --text-2:#B3BAC8; --text-3:#8D95A5;
  --accent:#98B5FF; --accent-2:#B4C9FF; --accent-soft:#24304D; --on-accent:#111318;
  --danger:#FF9DAA; --danger-soft:rgba(255,157,170,.14);
  --shadow:0 0 0 1px rgba(255,255,255,.07),0 12px 32px -8px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
button,input,select{font:inherit;color:inherit}
kbd{font:500 11px/1 var(--font);padding:2px 5px;border-radius:4px;border:1px solid var(--line-2);color:var(--text-3);background:var(--sunken)}
.app{height:100%;display:flex;flex-direction:column;min-width:0}

/* 상단 바 */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);flex:none}
.logo svg{width:13px;height:13px}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;font-weight:500}
.crumbs .app-name{color:var(--text-2)}
.crumbs .sep{color:var(--text-3)}
.crumbs .file{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.crumbs .file.none{color:var(--text-3);font-weight:400}
.dirty-dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);flex:none;display:none}
.dirty .dirty-dot{display:inline-block;background:#e5a13a}
.actions{display:flex;align-items:center;gap:6px}

.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--hover)}
.btn:focus-visible,.icon:focus-visible,.th-btn:focus-visible,.lk:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn svg{width:14px;height:14px;flex:none;color:var(--text-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary svg{color:currentColor}
.btn.primary:hover{background:var(--accent-2)}
.btn.primary kbd{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);color:inherit}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.split{display:inline-flex}
.split .btn:first-child{border-radius:7px 0 0 7px}
.split .btn:last-child{border-radius:0 7px 7px 0;border-left:0;padding:0 7px}
.icon{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:7px;border:0;background:transparent;color:var(--text-2);cursor:pointer}
.icon:hover{background:var(--hover);color:var(--text)}
.icon svg{width:16px;height:16px}

.banner{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13px;color:var(--text-2);flex-wrap:wrap}
.banner b{color:var(--text);font-weight:600}
.banner .btn{height:26px}

/* 툴바 */
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.seg{display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--sunken);border:1px solid var(--line)}
.seg button{border:0;background:transparent;height:24px;padding:0 9px;border-radius:6px;cursor:pointer;color:var(--text-2);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line-2),0 1px 2px rgba(0,0,0,.06)}
.seg .c{color:var(--text-3);font-variant-numeric:tabular-nums;font-size:12px}
.spacer{flex:1}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:9px;width:14px;height:14px;color:var(--text-3)}
.search input{height:30px;width:220px;max-width:100%;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);padding:0 30px 0 29px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search kbd{position:absolute;right:7px;pointer-events:none}
.search input:focus ~ kbd,.search input:not(:placeholder-shown) ~ kbd{display:none}

/* 그리드 */
.wrap{flex:1;overflow:auto;position:relative;background:var(--bg)}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;height:34px;background:var(--panel);text-align:left}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--sunken);height:32px;font-weight:500;color:var(--text-2);font-size:12.5px}
.grid .sticky{position:sticky;z-index:2}
.grid thead .sticky{z-index:4}
.grid .c-rn{left:0;width:var(--rn)}
.grid .c-name{left:var(--rn);box-shadow:1px 0 0 var(--line-2)}
.grid tbody tr:hover td{background:var(--hover)}
.grid tbody tr:focus-within td{background:var(--sel)}
.grid tbody tr.dropped td:not(.c-rn) > *{opacity:.45}
.th-btn{width:100%;height:100%;border:0;background:transparent;display:flex;align-items:center;gap:6px;padding:0 10px;cursor:pointer;color:inherit;font-weight:500;text-align:left}
.th-btn:hover{background:var(--hover);color:var(--text)}
.th-btn .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti{width:13px;height:13px;color:var(--text-3);flex:none}
.th-btn .sort{color:var(--accent);font-size:11px;flex:none}
.th-static{padding:0 10px;display:flex;align-items:center;height:100%;gap:6px}
th{position:relative}
.resizer{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:5}
.resizer:hover,.resizer.on{background:linear-gradient(var(--accent),var(--accent)) center/2px 100% no-repeat}
.c-add .icon{width:100%;height:100%;border-radius:0}

.cell{width:100%;height:34px;border:0;background:transparent;padding:0 10px;outline:none;border-radius:0;color:var(--text)}
.cell:focus{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--panel)}
.cell.num{text-align:right;font-variant-numeric:tabular-nums}
.cell::placeholder{color:var(--text-3)}
.c-name .cell{font-weight:600}
input[type=date].cell{color:var(--text-2);font-variant-numeric:tabular-nums}
input[type=date].cell:invalid,input[type=date].cell[value=""]{color:var(--text-3)}
.sel-wrap{height:34px;display:flex;align-items:center;padding:0 6px}
select.sel{appearance:none;-webkit-appearance:none;border:0;outline:none;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;cursor:pointer;max-width:100%;background:var(--tb,transparent);color:var(--tc,var(--text-3))}
select.sel:focus-visible{box-shadow:0 0 0 2px var(--accent)}
select.sel option{background:var(--panel);color:var(--text)}
[data-tone=accent]{--tc:var(--accent);--tb:var(--accent-soft)}
[data-tone=green]{--tc:#1f9d63;--tb:rgba(31,157,99,.12)}
[data-tone=amber]{--tc:#c47d12;--tb:rgba(229,161,58,.15)}
[data-tone=gray]{--tc:var(--text-2);--tb:var(--sunken);box-shadow:inset 0 0 0 1px var(--line-2)}
[data-tone=red]{--tc:var(--danger);--tb:var(--danger-soft)}
[data-tone=teal]{--tc:#138a9e;--tb:rgba(19,138,158,.12)}
[data-tone=violet]{--tc:#9a5bd6;--tb:rgba(154,91,214,.13)}
[data-tone=none]{--tc:var(--text-3);--tb:transparent}

.c-rn{text-align:center!important;color:var(--text-3);font-variant-numeric:tabular-nums;font-size:12px}
.rn{position:relative;height:34px;display:grid;place-items:center}
.rn .grip,.rn .del{position:absolute;top:6px;bottom:6px;width:22px;display:none;place-items:center;border:0;border-radius:6px;background:transparent;color:var(--text-3);padding:0}
.rn .grip{left:4px;cursor:grab;touch-action:none}
.rn .del{right:4px;cursor:pointer}
.rn .grip svg,.rn .del svg{width:14px;height:14px}
tr:hover .rn .n,tr:focus-within .rn .n{visibility:hidden}
tr:hover .rn .grip,tr:hover .rn .del,tr:focus-within .rn .grip,tr:focus-within .rn .del{display:grid}
.rn .grip:hover{background:var(--hover);color:var(--text)}
.rn .del:hover{background:var(--danger-soft);color:var(--danger)}
html.sorted .rn .grip{cursor:not-allowed;opacity:.35}
/* 행 끌기 */
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none!important}
.grid tbody tr.drag-src td{background:var(--sunken)!important}
.grid tbody tr.drag-src td > *{opacity:.35}
.drop-line{position:absolute;left:0;height:2px;margin-top:-1px;background:var(--accent);pointer-events:none;z-index:6;border-radius:2px}
.drop-line::before{content:"";position:absolute;left:6px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);box-sizing:border-box}
.drag-ghost{position:fixed;z-index:80;pointer-events:none;display:flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 8px;border-radius:8px;background:var(--panel);box-shadow:var(--shadow);font-weight:600;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:rotate(-1deg)}
.drag-ghost svg{width:14px;height:14px;color:var(--text-3);flex:none}
@keyframes moved{from{background:var(--accent-soft)}to{background:var(--panel)}}
.grid tbody tr.moved td{animation:moved 1.2s ease-out}

.name-cell{display:flex;align-items:center;height:34px;min-width:0;cursor:text}
.name-cell .cell{flex:0 1 auto;width:auto;min-width:2ch;field-sizing:content;max-width:100%;text-overflow:ellipsis}
.name-cell:not(.has-links) .cell,.name-cell:focus-within .cell{flex:1 1 auto;max-width:none}
@supports not (field-sizing:content){.name-cell .cell{flex:1 1 auto}}
.lks{display:flex;gap:2px;align-items:center;flex:none;padding-right:8px;margin-left:-4px}
.name-cell:not(.has-links) .lks,.name-cell:focus-within .lks{display:none}
.lk{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;text-decoration:none;opacity:.8;transition:background .12s,opacity .12s,transform .12s}
.lk:hover{background:var(--hover);opacity:1;transform:translateY(-1px)}
tr:hover .lk{opacity:1}
.lk img{width:14px;height:14px;border-radius:3px;display:block}
.lk .fb{font-size:10px;font-weight:700;color:var(--text-2)}
.addrow td{background:transparent!important;border-right:0}
.addrow button{height:34px;border:0;background:transparent;color:var(--text-3);cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:0 12px;position:sticky;left:0}
.addrow button:hover{color:var(--accent)}
.addrow svg{width:14px;height:14px}

.empty{padding:56px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;color:var(--text-2);position:sticky;left:0;width:min(100vw,720px)}
.empty h3{margin:0;font-size:15px;color:var(--text);font-weight:600}
.empty p{margin:0;max-width:42ch}
.empty .row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.empty .recents{margin-top:14px;width:100%;max-width:380px;text-align:left}
.empty .recents h4{margin:0 0 6px;font-size:12px;color:var(--text-3);font-weight:500}

/* 하단 상태 줄 */
.statusbar{display:flex;align-items:center;gap:14px;padding:0 16px;height:30px;border-top:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden}
.statusbar .st{display:inline-flex;align-items:center;gap:6px;color:var(--text-2)}
.statusbar .st i{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.statusbar .st.ok i{background:#1f9d63}.statusbar .st.dirty i{background:#e5a13a}.statusbar .st.err i{background:var(--danger)}.statusbar .st.saving i{background:var(--accent)}
.statusbar .hint{margin-left:auto;display:flex;gap:10px;align-items:center}
@media (max-width:760px){.statusbar .hint{display:none}.search input{width:160px}}

/* 팝오버·메뉴 */
.pop{position:fixed;z-index:50;min-width:220px;max-width:min(340px,calc(100vw - 16px));background:var(--panel);border-radius:10px;box-shadow:var(--shadow);padding:5px;animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 9px;border:0;background:transparent;border-radius:6px;cursor:pointer;text-align:left;color:var(--text)}
.mi:hover,.mi.act{background:var(--hover)}
.mi svg{width:14px;height:14px;color:var(--text-3);flex:none}
.mi .k{margin-left:auto;color:var(--text-3);font-size:11.5px}
.mi.danger{color:var(--danger)}.mi.danger svg{color:var(--danger)}
.mi[disabled]{opacity:.4;pointer-events:none}
.mi.on{color:var(--accent);font-weight:600}
.msep{height:1px;background:var(--line);margin:4px -5px}
.mlabel{padding:6px 9px 3px;font-size:11.5px;color:var(--text-3);font-weight:500}
.mfield{padding:4px}
.mfield input,.mfield textarea{width:100%;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);height:30px;padding:0 9px;outline:none}
.mfield textarea{height:64px;padding:7px 9px;resize:vertical;font:inherit}
.mfield input:focus,.mfield textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:4px}
.types button{height:28px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);cursor:pointer;font-size:12px;color:var(--text-2)}
.types button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.mfoot{display:flex;justify-content:flex-end;gap:6px;padding:6px 4px 3px}
.mnote{padding:6px 9px;font-size:11.5px;color:var(--text-3);line-height:1.5}
.ritem{display:flex;align-items:center;gap:8px;width:100%;padding:6px 9px;border-radius:6px;cursor:pointer;border:0;background:transparent;text-align:left}
.ritem:hover{background:var(--hover)}
.ritem svg{width:15px;height:15px;color:var(--text-3);flex:none}
.ritem .rn2{flex:1;min-width:0}
.ritem .rt{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.ritem .rs{display:block;font-size:11.5px;color:var(--text-3)}
.ritem .x{opacity:0;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--text-3)}
.ritem:hover .x{opacity:1}
.ritem .x:hover{background:var(--line);color:var(--text)}

/* 명령 팔레트 */
.cmd-bg{position:fixed;inset:0;z-index:60;background:rgba(10,10,14,.32);display:flex;justify-content:center;align-items:flex-start;padding-top:14vh}
.cmd{width:min(560px,calc(100vw - 32px));background:var(--panel);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;animation:pop .12s ease-out}
.cmd input{width:100%;height:48px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 16px;font-size:15px;outline:none}
.cmd ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.cmd li{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:7px;cursor:pointer;color:var(--text)}
.cmd li svg{width:15px;height:15px;color:var(--text-3)}
.cmd li .k{margin-left:auto;color:var(--text-3);font-size:12px}
.cmd li.act{background:var(--hover)}
.cmd .none{padding:16px;color:var(--text-3);text-align:center}

.toast{position:fixed;left:50%;bottom:44px;transform:translate(-50%,8px);background:var(--text);color:var(--bg);border-radius:9px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:70;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:6px;height:26px;padding:0 10px;cursor:pointer;font-weight:600}
.toast:not(.has-act){padding-right:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand" id="brand">
      <div class="crumbs">
        <span class="app-name">매물 노트</span><span class="sep">/</span>
        <span class="file none" id="fileLabel">저장 안 된 새 표</span>
        <span class="dirty-dot" title="저장 안 된 변경"></span>
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="btnCmd" type="button" title="명령 팔레트">명령 <kbd>⌘K</kbd></button>
      <div class="split">
        <button class="btn" id="btnOpen" type="button" title="파일 불러오기 (⌘O)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M1.75 4.25c0-.83.67-1.5 1.5-1.5h3l1.5 1.5h5c.83 0 1.5.67 1.5 1.5v6.5c0 .83-.67 1.5-1.5 1.5h-9.5c-.83 0-1.5-.67-1.5-1.5z"/></svg>
          불러오기</button>
        <button class="btn" id="btnRecent" type="button" aria-label="최근 파일" title="최근 파일">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"/></svg></button>
      </div>
      <button class="btn primary" id="btnSave" type="button" title="저장 (⌘S)">저장 <kbd>⌘S</kbd></button>
      <button class="icon" id="btnMore" type="button" aria-label="더 보기">

const isDropped = r => { const c = doc.columns.find(c => c.id === "status"); return !!c && r.cells[c.id] === "탈락"; };
const tone = (col, v) => { if (!v) return "none"; const i = (col.options || []).indexOf(v); return i < 0 ? "gray" : TONES[i % TONES.length]; };

function normalize(d){
  const out = {columns:[], rows:[]};
  const cols = Array.isArray(d?.columns) ? d.columns : [];
  const seen = new Set();
  cols.forEach(c => {
    if (!c || !c.name) return;
    let id = String(c.id || uid()); while (seen.has(id)) id = uid(); seen.add(id);
    const type = TYPES[c.type] ? c.type : "text";
    const col = {id, name:String(c.name), type, width:Math.max(60, Math.min(800, +c.width || 120))};
    if (type === "select") col.options = Array.isArray(c.options) ? c.options.map(String).filter(Boolean) : [];
    out.columns.push(col);
  });
  let ni = out.columns.findIndex(c => c.id === "name");
  if (ni < 0) { out.columns.unshift({id:"name", name:"아파트", type:"text", width:200}); ni = 0; }
  const [n] = out.columns.splice(ni, 1); n.locked = true; n.type = "text"; out.columns.unshift(n);
  (Array.isArray(d?.rows) ? d.rows : []).forEach(r => {
    if (!r) return;
    const cells = {}; const src = r.cells || {};
    out.columns.forEach(c => { if (src[c.id] !== undefined && src[c.id] !== null) cells[c.id] = String(src[c.id]); });
    out.rows.push({id:String(r.id || rid()), cells});
  });
  return out;
}

/* ── IndexedDB: 최근 파일 핸들 보관 ─────────────────── */
const idb = (() => {
  let p;

function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += ch;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
function csvToDoc(text){
  const rows = parseCSV(text);
  if (!rows.length) throw new Error("빈 CSV입니다");
  const head = rows[0].map(h => h.trim());
  const body = rows.slice(1);
  const NAME_KEYS = ["아파트","아파트명","단지","단지명","name","이름"];
  let ni = head.findIndex(h => NAME_KEYS.includes(h.toLowerCase ? h.toLowerCase() : h)); if (ni < 0) ni = 0;
  const base = defaultDoc().columns;
  const cols = head.map((h, i) => {
    const vals = body.map(r => (r[i] ?? "").trim()).filter(Boolean);
    const known = base.find(b => b.name === h);
    if (i === ni) return {id:"name", name:h || "아파트", type:"text", width:200};
    if (known && known.id !== "name") {
      const c = clone(known); c.id = known.id;
      if (c.type === "select") vals.forEach(v => { if (!c.options.includes(v)) c.options.push(v); });
      return c;
    }
    let type = "text";
    if (vals.length && vals.every(v => /^\d{4}-\d{2}-\d{2}$/.test(v))) type = "date";
    else if (vals.length && vals.every(v => numOf(v) !== null && /^[\s\d.,\-+%억만원]*$/.test(v))) type = "number";
    return {id:uid(), name:h || "컬럼 " + (i + 1), type, width:Math.min(320, Math.max(88, h.length * 14 + 40))};
  });
  const ids = new Set(); cols.forEach(c => { while (ids.has(c.id)) c.id = uid(); ids.add(c.id); });
  return normalize({columns:cols, rows:body.map(r => ({id:rid(), cells:Object.fromEntries(cols.map((c, i) => [c.id, (r[i] ?? "").trim()]).filter(([, v]) => v !== ""))}))});
}
function parseText(text, name){
  if (/\.csv$/i.test(name) || !/^\s*[{[]/.test(text)) return csvToDoc(text);

    return csvToDoc([keys, ...j.map(o => keys.map(k => o?.[k] ?? ""))].map(r => r.map(csvCell).join(",")).join("\n"));

}
const csvCell = v => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function toCSV(){ return "﻿" + [doc.columns.map(c => csvCell(c.name)).join(","), ...doc.rows.map(r => doc.columns.map(c => csvCell(r.cells[c.id])).join(","))].join("\r\n"); }
function toJSON(){ return JSON.stringify({app:APP, version:VERSION, savedAt:new Date().toISOString(), columns:doc.columns.map(({locked, ...c}) => c), rows:doc.rows}, null, 2); }
const serialize = name => /\.csv$/i.test(name || "") ? toCSV() : toJSON();

function visibleRows(){
  const fc = filterCol(); const q = view.q.trim().toLowerCase();

    if (fc && view.filter !== "전체") { const v = r.cells[fc.id] || ""; if (view.filter === "__none" ? v !== "" : v !== view.filter) return false; }
    if (q && !doc.columns.some(c => String(r.cells[c.id] || "").toLowerCase().includes(q))) return false;
    return true;
  });
  const s = view.sort; const col = s && doc.columns.find(c => c.id === s.col);
  if (col) {
    const key = r => { const v = r.cells[col.id]; if (v === undefined || v === "") return null;
      if (col.type === "number") return numOf(v);
      if (col.type === "select") { const i = (col.options || []).indexOf(v); return i < 0 ? 999 : i; }
      return String(v); };
    rows = rows.map((r, i) => ({r, k:key(r), i})).sort((a, b) => {
      if (a.k === null && b.k === null) return a.i - b.i; if (a.k === null) return 1; if (b.k === null) return -1;

function pushUndo(label){ undoStack.push({doc:clone(doc), label}); if (undoStack.length > 30) undoStack.shift(); }
function undo(){
  const u = undoStack.pop(); if (!u) { toast("되돌릴 작업이 없어요"); return; }

function moveRow(id, beforeId){ // beforeId가 없으면 보이는 마지막 행 뒤로
  const from = doc.rows.findIndex(r => r.id === id); if (from < 0) return false;
  let to;
  if (beforeId) to = doc.rows.findIndex(r => r.id === beforeId);
  else { const vis = visibleRows(); to = doc.rows.findIndex(r => r.id === vis[vis.length - 1]?.id) + 1; }
  if (to < 0 || to === from || to === from + 1) return false;
  pushUndo("순서 변경을");
  const [row] = doc.rows.splice(from, 1); if (to > from) to--; doc.rows.splice(to, 0, row);
  changed(); renderBody();
  const tr = document.querySelector(`tr[data-id="${id}"]`);
  if (tr) { tr.classList.add("moved"); tr.scrollIntoView({block:"nearest"}); setTimeout(() => tr.classList.remove("moved"), 1300); }
  return true;
}

  const t = $("#toast"), b = $("#toastAct");
  $("#toastMsg").textContent = msg;
  b.hidden = !actLabel; t.classList.toggle("has-act", !!actLabel);
  if (actLabel) { b.textContent = actLabel; b.onclick = () => { t.classList.remove("show"); act(); }; }
  t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), actLabel ? 6000 : 2400);
}
function showBanner(html, btns){
  const b = $("#banner"); b.hidden = false;
  b.innerHTML = `<span>${html}</span>` + btns.map((x, i) => `<button class="btn${i === 0 ? " primary" : " ghost"}" type="button" data-bi="${i}">${x.label}</button>`).join("");
  b.onclick = e => { const k = e.target.closest("[data-bi]"); if (k) btns[+k.dataset.bi].fn(); };
}
function hideBanner(){ $("#banner").hidden = true; }

/* ── 버튼·단축키 ─────────────────────────────────── */
$("#btnOpen").addEventListener("click", openPicker);
$("#btnRecent").addEventListener("click", e => { e.stopPropagation(); if (!pop.hidden && pop.dataset.kind === "recent") closePop(); else showRecent(e.currentTarget); });
$("#btnSave").addEventListener("click", () => save());
$("#btnMore").addEventListener("click", e => { e.stopPropagation(); if (!pop.hidden && pop.dataset.kind === "more") closePop(); else moreMenu(e.currentTarget); });
$("#btnCmd").addEventListener("click", openCmd);
$("#btnAddRow").addEventListener("click", addRow);
$("#btnAddCol").addEventListener("click", e => { e.stopPropagation(); addColPop(e.currentTarget); });
$("#q").addEventListener("input", e => { view.q = e.target.value; renderBody(); });
$("#q").addEventListener("keydown", e => { if (e.key === "Escape") { e.target.value = ""; view.q = ""; renderBody(); e.target.blur(); } });
document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey; const k = e.key.toLowerCase();
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (mod && k === "s") { e.preventDefault(); save({as:e.shiftKey}); return; }
  if (mod && k === "o") { e.preventDefault(); openPicker(); return; }
  if (mod && k === "k") { e.preventDefault(); $("#cmdBg").hidden ? openCmd() : closeCmd(); return; }
  if (e.key === "Escape" && !pop.hidden) { closePop(); return; }
  if (typing || mod || e.altKey) { if (mod && k === "z" && !typing) { e.preventDefault(); undo(); } return; }
  if (!$("#cmdBg").hidden) return;
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
  else if (k === "n") { e.preventDefault(); addRow(); }
});
document.addEventListener("keydown", e => { // 최근 파일 항목 키보드로 열기
  if ((e.key === "Enter" || e.key === " ") && document.activeElement?.matches?.(".ritem")) { e.preventDefault(); document.activeElement.click(); }
});

/* 파비콘이 깨지면 글자로 바꾼다 */
document.addEventListener("error", e => { const img = e.target; if (img instanceof HTMLImageElement && img.dataset.fb) { const s = document.createElement("span"); s.className = "fb"; s.textContent = img.dataset.fb; img.replaceWith(s); } }, true);

/* ── 시작 ─────────────────────────────────────────── */
(async function init(){
  const th = ls.get(LS_THEME); if (th && th !== "system") document.documentElement.dataset.theme = th;
  try { const v = JSON.parse(ls.get(LS_VIEW)); if (v) { view.filter = v.filter || "전체"; view.sort = v.sort || null; } } catch {}
  const draft = readDraft();
  if (draft) { doc = draft.doc; fileName = draft.fileName || null; dirty = !!draft.dirty; } else doc = defaultDoc();
  render();
  await loadRecent();
  const last = recent[0];
  if (FS && last && last.handle && (!fileName || fileName === last.name)) {
    let p = "prompt"; try { p = await last.handle.queryPermission({mode:"readwrite"}); } catch {}
    if (p === "granted" && !dirty) { await openHandle(last.handle, false); return; }
    if (p === "granted") { fileHandle = last.handle; fileName = last.name; canAutosave = true; scheduleAutosave(); renderChrome(); return; }
    showBanner(`지난번 파일 <b>${esc(last.name)}</b> · ${ago(last.openedAt)}${dirty ? " · 저장 안 된 변경 있음" : ""}`,
      [{label:"이 파일 다시 열기", fn:() => reopen(last)}, {label:"닫기", fn:hideBanner}]);
  } else if (!FS && last && !fileName) {
    showBanner(`지난번에 <b>${esc(last.name)}</b>을(를) 불러왔어요 · 이 브라우저는 파일을 기억하지 못해 다시 골라야 해요`,
      [{label:"불러오기", fn:openPicker}, {label:"닫기", fn:hideBanner}]);
  }
  renderBody(); renderChrome();
})();
</script>
</body>
